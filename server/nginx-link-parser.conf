# ============================================================
# 链接解析服务 - Nginx 反向代理配置
# 适用：腾讯云 CVM（Ubuntu/Debian + nginx），域名 yc0717.cc
# 后端：Node.js 服务监听 127.0.0.1:3001（pm2 守护）
# 部署步骤见仓库根目录 DEPLOY.md
#
# 安装方式：
#   sudo cp nginx-link-parser.conf /etc/nginx/sites-available/link-parser.conf
#   sudo ln -s /etc/nginx/sites-available/link-parser.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ---------- HTTP：Let's Encrypt 校验 + 跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name yc0717.cc www.yc0717.cc;

    # certbot 自动校验路径（勿删）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：主服务 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yc0717.cc www.yc0717.cc;

    # TLS 证书（certbot 签发后为以下路径，域名不同则相应替换）
    ssl_certificate     /etc/letsencrypt/live/yc0717.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yc0717.cc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 请求体上限（与后端 express.json limit 1mb 对齐）
    client_max_body_size 1m;

    # ---- 安全响应头（JSON API 服务，策略从严） ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # HSTS：确认 HTTPS 连续稳定运行后再开启（开启后强制 1 年 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 后端地址
    set $backend 127.0.0.1:3001;

    # 主路由：API / 代理 / 下载
    location / {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 视频播放 / 大文件下载：关闭缓冲保证流式，超时放宽，支持 Range 分片
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        proxy_connect_timeout 10s;
    }

    # 健康检查（可挂云监控/宝塔探活）
    location = /health {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
