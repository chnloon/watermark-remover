<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YCGEE 云川集 · 你的想法是一颗星辰</title>
<meta name="description" content="YCGEE 云川集——普通人的想象力乌托邦。说出你的想法，让它像星辰一样诞生、发光、被看见。惊喜工坊 · 作品广场 · 创意集市">
<style>
/* ========================================
   YCGEE 云川集 · v4 「想法星云」
   概念：每个想法/作品是一颗星体，输入想法=新星诞生
   创新：滚动穿越星云、星体脉动呼吸、鼠标视差
   ======================================== */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC',
    'Microsoft YaHei', sans-serif;
  background: #eef3fb;              /* 浅云蓝（透出云海） */
  color: #1f2937;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---- 宇宙画布（全屏星尘，在氛围图之上） ---- */
#universe {
  position: fixed; inset: 0;
  z-index: 1;
  display: block;
  pointer-events: none;
}

/* ---- 导航（悬浮于星空中） ---- */
.nav {
  position: fixed; top:0; left:0; right:0;
  z-index: 100;
  height: 56px;
  display: flex; align-items:center; justify-content:space-between;
  padding: 0 40px;
  background: linear-gradient(to bottom, rgba(255,255,255,.82), transparent);
}
.nav__brand {
  font-size:16px; font-weight:800; letter-spacing:3px;
  text-decoration:none;
  display:flex; align-items:center; gap:10px;
}
/* YCGEE 英文：流光溢彩蓝色动效 */
.nav__brand .en {
  font-size:17px; font-weight:800; letter-spacing:3px;
  background: linear-gradient(90deg, #2b6cff, #4a9eff, #00d4ff, #2b6cff);
  background-size: 200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:shimmer 3s linear infinite;
}
/* 汉字：白色 + 灰色阴影（浅色背景中增强存在感） */
.nav__brand .zh {
  font-size:12px; font-weight:600; letter-spacing:3px;
  color:#ffffff;
  text-shadow:0 1px 3px rgba(90,100,120,.5), 0 0 8px rgba(255,255,255,.4);
}
@keyframes shimmer {
  to { background-position: -200% center; }
}
.nav__links { display:flex; gap:28px; align-items:center; }
.nav__link { font-size:13px; color:#4b5563; text-decoration:none; letter-spacing:1px; transition:color .2s; font-weight:500; }
.nav__link:hover { color:#2b6cff; }
.nav__cta {
  font-size:13px; font-weight:600;
  opacity:.5;
  color:#fff; background:#2b6cff;   /* 蓝色 */
  border:none; border-radius:100px; padding:9px 22px; cursor:pointer;
  transition:transform .2s, box-shadow .2s;
}
.nav__cta:hover { transform:translateY(-1px); box-shadow:0 8px 30px rgba(43,108,255,.3); }

/* ---- Hero（星空中的文字） ---- */
.hero {
  position:relative; z-index:2;
  min-height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:120px 20px 60px;
  text-align:center;
}
.hero__eyebrow {
  font-size:11px; letter-spacing:8px; text-transform:uppercase;
  color:#64748b; margin-bottom:28px;
  animation:floatIn 1s ease both;
}
.hero__title {
  font-size:clamp(40px, 7.5vw, 80px);
  font-weight:700; letter-spacing:-2px; line-height:1.05;
  color:#1e293b;
  text-shadow:0 2px 12px rgba(255,255,255,.6), 0 1px 3px rgba(90,100,120,.25);
  animation:floatIn 1s .1s ease both;
}
.hero__title .light { color:#475569; font-weight:500; }
.hero__sub {
  font-size:clamp(15px, 2vw, 18px);
  color:#475569; margin-top:22px; letter-spacing:2px;
  animation:floatIn 1s .2s ease both;
}

/* ---- 想法输入（星门） ---- */
.gate {
  width:100%; max-width:640px;
  margin-top:52px;
  animation:floatIn 1s .3s ease both;
}
/* 输入条：flex 布局，按钮完全内嵌（浅色透明） */
.gate__bar {
  display:flex; align-items:stretch;
  opacity:.5;
  background:rgba(255,255,255,.65);
  border:1px solid rgba(148,163,184,.35);
  border-radius:14px;
  padding:6px 6px 6px 20px;
  backdrop-filter:blur(12px);
  box-shadow:0 4px 24px rgba(100,116,139,.15);
  transition:border-color .3s, box-shadow .3s;
}
.gate__bar:focus-within {
  border-color:rgba(43,108,255,.6);
  box-shadow:0 4px 30px rgba(43,108,255,.25);
}
.gate__input {
  flex:1; min-width:0;
  background:transparent; border:none; outline:none;
  padding:16px 12px 16px 8px;
  font-size:16px; color:#1e293b;
  font-family:inherit; letter-spacing:.5px;
}
.gate__input::placeholder { color:#94a3b8; }
.gate__btn {
  flex-shrink:0; align-self:center;
  opacity:.5;
  background:linear-gradient(135deg, #4a9eff, #2b6cff);
  color:#fff; border:none; border-radius:10px;
  padding:14px 26px; font-size:14px; font-weight:600;
  cursor:pointer; font-family:inherit; letter-spacing:2px;
  white-space:nowrap;
  box-shadow:0 4px 20px rgba(43,108,255,.35);
  transition:transform .2s, box-shadow .2s;
}
.gate__btn:hover { transform:scale(1.03); box-shadow:0 8px 30px rgba(43,108,255,.5); }
.gate__hint { margin-top:16px; font-size:12px; color:#6b7280; letter-spacing:1px; }

/* ---- 星云区（滚动穿越） ---- */
.nebula {
  position:relative; z-index:2;
  max-width:1100px; margin:80px auto 0; padding:0 24px;
}
.nebula__label { text-align:center; font-size:11px; letter-spacing:8px; text-transform:uppercase; color:#64748b; margin-bottom:60px;
}
.nebula__list { display:flex; flex-direction:column; gap:80px; }

/* 一颗星体（作品） */
.star {
  display:flex; align-items:center; gap:40px;
  opacity:.5;
  opacity:0; transform:scale(.92) translateY(40px);
  transition:opacity .9s ease, transform .9s ease;
  padding:24px;
  border-radius:20px;
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.5);
  box-shadow:0 8px 32px rgba(100,116,139,.12);
}
.star.in-view { opacity:1; transform:scale(1) translateY(0); }

.star__orb {
  flex-shrink:0;
  width:170px; height:170px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.8), rgba(240,244,255,.2) 60%);
  border:1px solid rgba(43,108,255,.2);
  position:relative;
  box-shadow:
    0 0 40px rgba(43,108,255,.15),
    inset 0 0 20px rgba(255,255,255,.4);
  animation:orbitPulse 4s ease-in-out infinite;
}
/* 行星光环 */
.star__orb::after {
  content:'';
  position:absolute; inset:-6px;
  border-radius:50%;
  border:1px solid rgba(43,108,255,.25);
  transform:rotate(-12deg) scaleX(1.08);
}
.star__orb svg {
  position:relative; z-index:1;
  filter:drop-shadow(0 2px 8px rgba(43,108,255,.3));
}

.star__body { flex:1; }
.star__title {
  font-size:24px; font-weight:600; letter-spacing:-.5px;
  color:#1e293b;
}
.star__desc { font-size:15px; color:#475569; margin-top:10px; line-height:1.7; letter-spacing:.3px; }
.star__tags { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.star__tag {
  font-size:11px; color:#334155; font-weight:500;
  background:rgba(255,255,255,.6);
  border:1px solid rgba(148,163,184,.3);
  border-radius:100px; padding:3px 12px; letter-spacing:.5px;
}
.star__meta { flex-shrink:0; font-size:13px; color:#64748b; text-align:right; }

/* ---- 栏目（星域） ---- */
.regions {
  position:relative; z-index:2;
  max-width:1100px; margin:120px auto 0; padding:0 24px;
}
.regions__grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:44px; }
.region {
  background:rgba(255,255,255,.45);
  opacity:.5;
  border:1px solid rgba(255,255,255,.6);
  border-radius:16px; padding:36px 28px; cursor:pointer;
  backdrop-filter:blur(10px);
  box-shadow:0 8px 32px rgba(100,116,139,.12);
  transition:transform .3s, background .3s, border-color .3s;
}
.region:hover { transform:translateY(-4px); background:rgba(255,255,255,.65); border-color:rgba(43,108,255,.3); }
.region__icon {
  width:52px; height:52px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 35% 30%, rgba(43,108,255,.12), rgba(43,108,255,.03) 60%);
  border:1px solid rgba(43,108,255,.25);
  box-shadow:0 0 24px rgba(43,108,255,.12);
}
.region__title { font-size:19px; font-weight:600; margin-top:14px; color:#1e293b; }
.region__desc { font-size:14px; color:#475569; margin-top:10px; line-height:1.6; }
.region__link { display:inline-block; margin-top:14px; font-size:14px; color:#2b6cff; text-decoration:none; }

/* ---- 页脚 ---- */
.footer {
  position:relative; z-index:2;
  margin-top:120px; padding:44px 20px;
  border-top:1px solid rgba(148,163,184,.25);
  text-align:center; font-size:12px; color:#64748b; letter-spacing:2px;
}

/* ---- 解压彩蛋（星尘气泡） ---- */
.zen-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(238,243,251,.96);
  display:none; overflow:hidden; cursor:pointer;
}
.zen-overlay.active { display:block; }
.zen-hint { position:absolute; top:18%; left:50%; transform:translateX(-50%); text-align:center; z-index:5; pointer-events:none; }
.zen-hint__main { font-size:24px; font-weight:600; color:#1e293b; letter-spacing:1px; }
.zen-hint__sub { font-size:13px; color:#64748b; margin-top:10px; letter-spacing:1px; }
.zen-hint__progress { margin-top:16px; font-size:12px; color:#2b6cff; letter-spacing:2px; }

.zen-bubble {
  position:absolute; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; user-select:none; opacity:0;
  animation:bubbleRise 5s ease-in infinite;
}
.zen-bubble__text { font-size:12px; font-weight:600; letter-spacing:1px; }
@keyframes bubbleRise {
  0%{transform:translateY(30px);opacity:0;} 15%{opacity:1;} 80%{opacity:1;} 100%{transform:translateY(-60px);opacity:0;}
}
.zen-burst {
  position:fixed; z-index:210; font-size:32px; font-weight:700;
  letter-spacing:2px; pointer-events:none;
  animation:burstPop 1.4s ease-out forwards; white-space:nowrap;
}
@keyframes burstPop {
  0%{transform:scale(.3);opacity:0;} 20%{transform:scale(1.15);opacity:1;} 40%{transform:scale(1);} 100%{transform:translateY(-90px) scale(1.05);opacity:0;}
}
.zen-particle {
  position:fixed; z-index:209; width:6px; height:6px; border-radius:50%;
  pointer-events:none; animation:particleFly .8s ease-out forwards;
}
@keyframes particleFly {
  0%{transform:translate(0,0) scale(1);opacity:1;} 100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}
}

/* ---- 星体脉动 ---- */
@keyframes orbitPulse {
  0%,100%{ box-shadow:0 0 50px rgba(200,168,110,.12), inset 0 0 30px rgba(255,255,255,.03); }
  50%{ box-shadow:0 0 90px rgba(200,168,110,.28), inset 0 0 40px rgba(255,255,255,.05); }
}

@keyframes floatIn {
  from{opacity:0;transform:translateY(24px);} to{opacity:1;transform:translateY(0);}
}

/* ---- 响应式 ---- */
@media(max-width:834px){
  .star{flex-direction:column;text-align:center;gap:24px;}
  .star__meta{text-align:center;}
  .regions__grid{grid-template-columns:1fr;}
  .nav__links .nav__link{display:none;}
}
</style>
</head>
<body>

<!-- ===== 背景层：Kling 动效视频 + 光晕 + 云海 + 星尘 ===== -->
<!-- ① 动效视频背景（Kling AI 制作，JS 控制加载后渐入） -->
<video class="bg-video" id="bgVideo" muted loop playsinline preload="auto">
  <source src="video/bg.mp4" type="video/mp4">

<!-- ② 蓝色光晕（缓缓流动） -->
<div class="bg-aura" aria-hidden="true">

<canvas id="universe"></canvas>

<!-- 星域 -->
<section class="regions" id="regions">
  <div class="regions__grid">

<script>
/* ========================================
   背景层（方案C：氛围图+动效）
   ======================================== */
/* ① 动效视频背景（云层之上，JS加载后渐入，避免闪白） */
.bg-video {
  position: fixed; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  z-index:0;
  pointer-events:none;
  opacity:0;
  transition:opacity 1s ease;
  filter:brightness(1.05) saturate(1.05);
}
.bg-video.loaded { opacity:1; }

/* ② 金色光晕（缓缓流动） */
.bg-aura { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.bg-aura__orb {
  position:absolute; border-radius:50%;
  filter:blur(80px);
  opacity:.35;
  mix-blend-mode:screen;
  animation:auraFloat 14s ease-in-out infinite;
}
.bg-aura__orb--1 {
  width:520px; height:520px; left:8%; top:12%;
  background:radial-gradient(circle, rgba(74,158,255,.35), transparent 70%);
}
.bg-aura__orb--2 {
  width:420px; height:420px; right:10%; top:30%;
  background:radial-gradient(circle, rgba(120,140,220,.4), transparent 70%);
  animation-delay:-5s;
}
.bg-aura__orb--3 {
  width:380px; height:380px; left:35%; bottom:10%;
  background:radial-gradient(circle, rgba(43,108,255,.3), transparent 70%);
  animation-delay:-9s;
}
@keyframes auraFloat {
  0%,100%{ transform:translate(0,0) scale(1); }
  33%{ transform:translate(40px,-30px) scale(1.08); }
  66%{ transform:translate(-30px,25px) scale(.95); }
}

/* ③ 底部云海（白色云雾，缓缓平移=活的） */
.bg-mist { position:fixed; left:0; right:0; bottom:0; height:40vh; z-index:0; pointer-events:none; overflow:hidden; }
.bg-mist__layer {
  position:absolute; left:0; right:0; bottom:0; height:100%;
  background:linear-gradient(to top, rgba(240,244,250,.9) 20%, transparent);
  opacity:.7;
}
.bg-mist__layer--back {
  background-image:radial-gradient(ellipse at 20% 100%, rgba(255,255,255,.9), transparent 60%),
                   radial-gradient(ellipse at 80% 100%, rgba(43,108,255,.1), transparent 55%);
  animation:mistShift 40s ease-in-out infinite;
}
.bg-mist__layer--front {
  background-image:radial-gradient(ellipse at 60% 100%, rgba(255,255,255,.8), transparent 55%);
  animation:mistShift 60s ease-in-out infinite reverse;
}
@keyframes mistShift {
  0%,100%{ transform:translateX(-2%); }
  50%{ transform:translateX(2%); }
}
/* ========================================
   背景视频加载控制（避免闪白）
   ======================================== */
const bgVideo = document.getElementById('bgVideo');
if (bgVideo) {
  const showVideo = () => {
    bgVideo.classList.add('loaded');
    bgVideo.play().catch(() => { /* 自动播放被拦则保持静音重试 */ });
  };
  if (bgVideo.readyState >= 2) {
    showVideo();
  } else {
    bgVideo.addEventListener('loadeddata', showVideo, { once: true });
    bgVideo.addEventListener('canplay', showVideo, { once: true });
    // 加载失败兜底：显示云海图
    bgVideo.addEventListener('error', () => {
      document.body.style.background =
        "url('https://images.unsplash.com/photo-1499346030926-9a72daac6c63?w=2560&q=80') center/cover fixed";
    }, { once: true });
  }
  // 超时兜底：3秒还没加载完也尝试显示
  setTimeout(() => {
    if (!bgVideo.classList.contains('loaded') && bgVideo.readyState > 0) showVideo();
  }, 3000);
}

const cv = document.getElementById('universe');
const ctx = cv.getContext('2d');
let W, H, stars = [], mouseX = 0, mouseY = 0;

function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; initStars(); }
function initStars() {
  stars = [];
  const count = Math.min(160, Math.floor(W * H / 9000));
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.6 + 0.3,
      tw: Math.random() * Math.PI * 2,
      sp: 0.5 + Math.random() * 1.2,   // 闪烁速度
      layer: Math.random() * 0.5 + 0.2, // 视差层
    });
  }
}
window.addEventListener('resize', resize);
resize();
window.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
});

let t = 0;
function drawUniverse() {
  t++;
  ctx.clearRect(0, 0, W, H);
  // 星空（带视差）
  stars.forEach(s => {
    const px = s.x - mouseX * s.layer * 0.02;
    const py = s.y - mouseY * s.layer * 0.02;
    const alpha = 0.35 + 0.5 * Math.abs(Math.sin(t / (1000 / s.sp) + s.tw));
    ctx.beginPath();
    ctx.arc(px, py, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(71, 85, 105, ${alpha})`;
    ctx.fill();
  });
  // 少量蓝色星（点缀）
  for (let i = 0; i < 12; i++) {
    const sx = (i * 137.5) % W;
    const sy = (i * 61.8) % H;
    const alpha = 0.3 + 0.4 * Math.sin(t / 600 + i);
    ctx.beginPath();
    ctx.arc(sx, sy, 1.2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(43, 108, 255, ${alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(drawUniverse);
}
requestAnimationFrame(drawUniverse);

const starList = document.getElementById('starList');

  stars_data.forEach(s => {
    const el = document.createElement('div');
    el.className = 'star';
    el.innerHTML = `
      <div class="star__orb">${s.svg}</div>
      <div class="star__body">
        <div class="star__title">${s.title}</div>
        <div class="star__desc">${s.desc}</div>
        <div class="star__tags">${s.tags.map(t=>`<span class="star__tag">${t}</span>`).join('')}</div>
      </div>
      <div class="star__meta">♥ ${s.likes}</div>`;
    starList.appendChild(el);
  });
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add('in-view'); obs.unobserve(en.target); }

  }, { threshold: 0.1, rootMargin: '0px 0px -60px 0px' });
  document.querySelectorAll('.star').forEach(el => obs.observe(el));
}

/* ---- 解压彩蛋（星尘气泡） ---- */
const zenOverlay = document.getElementById('zenOverlay');
const zenProgress = document.getElementById('zenProgress');
const AUSPICIOUS = ['恭喜发财','身体健康','万事如意','心想事成','好运连连','平安喜乐','财源广进','步步高升','福气满满','岁岁平安','天天开心','梦想成真','顺顺利利','幸福美满','喜气洋洋','学业有成','事业腾飞'];
const BUBBLES = [
  { bg:'rgba(255,255,255,.6)', br:'rgba(148,163,184,.35)', tx:'#334155', w:'福' },
  { bg:'rgba(255,255,255,.5)', br:'rgba(148,163,184,.3)', tx:'#475569', w:'喜' },
  { bg:'rgba(43,108,255,.12)', br:'rgba(43,108,255,.3)', tx:'#2b6cff', w:'吉' },
  { bg:'rgba(255,255,255,.55)', br:'rgba(148,163,184,.3)', tx:'#334155', w:'乐' },
  { bg:'rgba(0,212,255,.1)', br:'rgba(0,180,255,.25)', tx:'#0284c7', w:'顺' },
];
const WORDS = ['福','喜','吉','乐','顺','旺','安','美','好','爱','暖','甜'];
let bTimer=null, burst=0;

function spawnBubble() {
  if(!zenOverlay.classList.contains('active')) return;
  const o=zenOverlay, w=o.clientWidth, h=o.clientHeight;
  const edge=Math.floor(Math.random()*4), size=52+Math.random()*46;
  let x,y;
  if(edge===0){x=Math.random()*w;y=h+20;} else if(edge===1){x=Math.random()*w;y=-20;}
  else if(edge===2){x=-20;y=Math.random()*h;} else {x=w+20;y=Math.random()*h;}
  const st=BUBBLES[Math.floor(Math.random()*BUBBLES.length)];
  const wd=WORDS[Math.floor(Math.random()*WORDS.length)];
  const b=document.createElement('div');
  b.className='zen-bubble';
  b.style.cssText=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${st.bg};border:1px solid ${st.br};color:${st.tx};animation-duration:${4+Math.random()*3}s;animation-delay:${Math.random()*1.5}s;`;
  b.innerHTML=`<span class="zen-bubble__text">${wd}</span>`;
  b.addEventListener('click',e=>{e.stopPropagation();burstBubble(b,x+size/2,y+size/2);});
  o.appendChild(b);
  setTimeout(()=>b.remove(),(4+Math.random()*3)*1000+1500);
  if(o.querySelectorAll('.zen-bubble').length>20){const q=o.querySelector('.zen-bubble');if(q)q.remove();}
}

function burstBubble(b,cx,cy){
  const say=AUSPICIOUS[Math.floor(Math.random()*AUSPICIOUS.length)];
  if(b)b.remove();
  const bu=document.createElement('div');
  bu.className='zen-burst';bu.textContent=say;
  bu.style.cssText=`left:${cx}px;top:${cy}px;transform:translate(-50%,-50%);color:${Math.random()>.5?'#1e293b':'#2b6cff'};`;
  document.body.appendChild(bu);setTimeout(()=>bu.remove(),1500);
  for(let i=0;i<10;i++){
    const p=document.createElement('div');p.className='zen-particle';
    const ang=(Math.PI*2*i)/10+Math.random()*.5,dist=40+Math.random()*50;
    p.style.cssText=`left:${cx}px;top:${cy}px;background:\;--dx:${Math.cos(ang)*dist}px;--dy:${Math.sin(ang)*dist}px;`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),850);
  }
  burst++;
  zenProgress.textContent = burst%5===0 ? `已收集 ${burst} 份好运 ✨` : `＋1 好运（已收集 ${burst} 份）`;
}

function startZen(){burst=0;zenProgress.textContent='点点星尘，把好运气带回家';zenOverlay.classList.add('active');for(let i=0;i<8;i++)setTimeout(spawnBubble,i*120);bTimer=setInterval(spawnBubble,700);}
function stopZen(){if(bTimer)clearInterval(bTimer);bTimer=null;zenOverlay.classList.remove('active');zenOverlay.querySelectorAll('.zen-bubble').forEach(b=>b.remove());}
zenOverlay.addEventListener('click',e=>{if(e.target===zenOverlay)burstBubble(null,e.clientX,e.clientY);});

document.querySelector('.gate__btn').addEventListener('click',()=>{
  const v=document.querySelector('.gate__input').value.trim();
  if(!v)return;
  document.querySelector('.gate__hint').textContent='✨ 你的想法正在化为星辰…';
  startZen();
  setTimeout(()=>{stopZen();document.querySelector('.gate__hint').textContent='🎉 演示版：连接 AI 后，你的星辰将在这里诞生';},12000);
});
